name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Copy site into the app (offline copy)
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html logo.png android/app/src/main/assets/
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ./gradlew assembleRelease --no-daemon -PsiteUrl="https://${OWNER}.github.io/${{ github.event.repository.name }}/"
      - name: Publish frlees.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk frlees.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk frlees.apk --title "frlees - Android" --notes "Telecharger frlees.apk w stabliha. dev by : frlees"
